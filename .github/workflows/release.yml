name: Выпуск

# Выпуск departament для ПК: сборка из кода этого репозитория (build.yml) и релиз на странице Releases.
# Программы у людей читают выпуски только отсюда и видят только опубликованные.
#
# Как выпустить версию (подробно — RELEASING.md):
#   • Actions → «Выпуск» → Run workflow → версия, например 1.2.3. Через 10–15 минут на странице
#     Releases появится черновик с установщиком и архивом обновления. «Publish release» — и выпуск вышел.
#   • Или сразу Releases → Draft a new release → тег v1.2.3 → Publish release. Установщик и архив
#     обновления сборка приложит к выпуску сама через 10–15 минут.
# Черновик можно пересобрать: запуск с тем же номером заменяет его новой сборкой. Опубликованный выпуск
# не пересобирается: люди, возможно, уже скачали его файлы. Для исправления нужна новая версия.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Версия, например 1.2.3 (для предварительного выпуска 1.2.3-rc.1)
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # Черновики выпусков видны только с правом записи. Без него проверка «такой выпуск уже есть»
    # не заметила бы черновик, и повторный запуск сделал бы второй.
    permissions:
      contents: write
    outputs:
      go: ${{ steps.plan.outputs.go }}
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      replace: ${{ steps.plan.outputs.replace }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IN_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "go=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            # Выпуск создан на странице Releases: собрать и приложить к нему файлы.
            mode=upload
            tag="$RELEASE_TAG"
            # Выпуск для Android (тег android-v…) собирает «Выпуск Android», программе для ПК тут делать нечего.
            if [[ "$tag" == android-* ]]; then
              echo "::notice::$tag — выпуск для Android, программа для ПК его не касается"
              exit 0
            fi
            version="${tag#[vV]}"
          else
            # Запуск из Actions: собрать и положить черновик, опубликует его владелец.
            mode=draft
            version="$(printf '%s' "$IN_VERSION" | tr -d '[:space:]')"
            version="${version#[vV]}"
            tag="v$version"
          fi
          # Строгая форма: по номеру программа решает, новее ли выпуск, чем она сама.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Версия '$version' не подходит: нужна вида 1.2.3 или 1.2.3-rc.1, тег выпуска — v1.2.3"
            exit 1
          fi
          if [ "$mode" = upload ]; then
            # Опубликовали черновик, который эта же сборка и сделала: файлы уже на месте, собирать нечего.
            assets=" $(gh release view "$tag" --json assets -q '[.assets[].name] | join(" ")') "
            if [[ "$assets" == *" departament-windows-x64.zip "* && "$assets" == *" departament-windows-x64.zip.sha256 "* && "$assets" == *" departament-setup.exe "* ]]; then
              echo "::notice::У выпуска $tag файлы уже есть, собирать нечего"
              exit 0
            fi
          else
            replace=false
            if draft="$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null)"; then
              if [ "$draft" != "true" ]; then
                echo "::error::Выпуск $tag уже опубликован. Укажите следующую версию."
                exit 1
              fi
              # Черновик люди не видели и не скачивали: его можно заменить новой сборкой.
              echo "::notice::Черновик $tag будет заменён новой сборкой"
              replace=true
            fi
            if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$tag" >/dev/null; then
              # Тег без выпуска остаётся, когда выпуск удалили на странице Releases: GitHub удаляет
              # выпуск, а тег оставляет. Такой номер никто не получал — тег убираем и собираем заново.
              if gh api "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>&1; then
                echo "::error::Тег $tag уже есть. Укажите следующую версию."
                exit 1
              fi
              echo "::notice::Тег $tag остался от удалённого выпуска — он удалён, выпуск соберётся заново"
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
            fi
          fi
          {
            echo "go=true"
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version=$version"
            echo "replace=${replace:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "Выпуск $tag ($mode) из $GITHUB_SHA"

  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      package_release: true

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes

      - uses: actions/download-artifact@v4
        with:
          name: release-assets

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ needs.plan.outputs.mode }}
          TAG: ${{ needs.plan.outputs.tag }}
          REPLACE: ${{ needs.plan.outputs.replace }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -euo pipefail
          sha256sum -c departament-windows-x64.zip.sha256
          files=(departament-setup.exe departament-windows-x64.zip departament-windows-x64.zip.sha256)

          if [ "$MODE" = upload ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            body="$RUNNER_TEMP/notes.md"
            {
              if [ -f "release-notes/v$VERSION.md" ]; then
                cat "release-notes/v$VERSION.md"
              else
                echo "Описание выпуска: что нового для людей. Отредактируйте его перед публикацией."
              fi
              printf '\n---\n\nПрограмма распространяется по лицензии GPL-3.0.\n'
            } > "$body"
            if [ "$REPLACE" = "true" ]; then
              # Пока шла сборка, черновик могли опубликовать — тогда его не трогаем — или удалить:
              # тогда просто кладём новый.
              state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo gone)"
              if [ "$state" = "false" ]; then
                echo "::error::Выпуск $TAG опубликован, пока шла сборка. Новая сборка не выложена."
                exit 1
              fi
              [ "$state" = "true" ] && gh release delete "$TAG" --yes
            fi
            flags=(--draft --title "departament $VERSION" --notes-file "$body")
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            # Тег появится при публикации, на собранном коммите. Если токену сборки нельзя указать коммит,
            # тег встанет на main в момент публикации.
            if ! gh release create "$TAG" "${files[@]}" --target "$SOURCE_SHA" "${flags[@]}"; then
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release upload "$TAG" "${files[@]}" --clobber
              else
                echo "::warning::Коммит $SOURCE_SHA не удалось указать для тега: тег встанет на main при публикации"
                gh release create "$TAG" "${files[@]}" "${flags[@]}"
              fi
            fi
          fi
          url="$(gh release view "$TAG" --json url -q .url)"
          if [ "$MODE" = upload ]; then
            echo "Файлы приложены к выпуску $TAG: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Черновик $TAG готов: $url — откройте его и нажмите «Publish release»." >> "$GITHUB_STEP_SUMMARY"
          fi
